    pending = pending.slice(ops.length);
    lastSave = { sha: res.commit.sha, short: res.commit.sha.slice(0, 7), at: new Date() };
    commits.unshift({ sha: res.commit.sha, short: lastSave.short, subject: message.split("\n")[0], date: new Date().toISOString(), refs: [...new Set(message.match(ID_RE) || [])], closes: [...new Set([...message.matchAll(CLOSE_RE)].map(m => m[1].toUpperCase()))] });
  } catch (e) {
    saveError = e instanceof TypeError ? "Not saved: api.github.com is unreachable. Check the connection and press Retry."
      : e.status === 401 || e.status === 403 ? "Not saved: the token can't write to this repository. Check its permissions in Settings."
      : e.status === 404 ? "Not saved: repository or branch not found." : "Not saved: " + e.message;
  } finally {
    saving = false;
    derive(); render();
    if (pending.length && !saveError) { clearTimeout(saveTimer); saveTimer = setTimeout(save, 1000); }
  }
}
window.addEventListener("beforeunload", e => { if (pending.length || saving) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); clearTimeout(saveTimer); save(); }
  else if (e.key === "Escape" && openEditor) { openEditor = null; render(); }
});

/* ---------- load from repo ---------- */
async function pool(items, n, fn) {
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } }));
  return out;
}
async function load() {
  if (!cfg.token) { render(); return; }
  if (saving) { setTimeout(load, 400); return; }
  if (pending.length) { clearTimeout(saveTimer); await save(); if (pending.length) return; }
  loading = true; loadError = null; render();
  try {
    const [file, treeRes, commitRes] = await Promise.all([
      gh(`${repoPath()}/contents/${TASKS_PATH}?ref=${encodeURIComponent(cfg.branch)}`),
      gh(`${repoPath()}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`),
      gh(`${repoPath()}/commits?sha=${encodeURIComponent(cfg.branch)}&per_page=60`)
    ]);
    const parsed = parseFile(b64decode(file.content));
    header = parsed.head; doc = parsed.data; fileSha = file.sha;
    const blobs = treeRes.tree.filter(x => x.type === "blob");
    tree = blobs.map(x => x.path);
    treeTruncated = !!treeRes.truncated;
    commits = commitRes.map(c => {
      const msg = c.commit.message, subject = msg.split("\n")[0];
      return { sha: c.sha, short: c.sha.slice(0, 7), subject, date: c.commit.author.date, refs: [...new Set(msg.match(ID_RE) || [])],
        closes: [...new Set([...msg.matchAll(CLOSE_RE)].map(m => m[1].toUpperCase()))] };
    });
    const scan = blobs.filter(b => SCAN_EXT.test(b.path) && !SKIP.test(b.path));
    const cache = store.get("heads", {});
    const fresh = {};
    const texts = await pool(scan, 8, async b => {
      if (cache[b.sha] != null) return cache[b.sha];
      const text = await gh(`${repoPath()}/git/blobs/${b.sha}`, { raw: true }).catch(() => null);
      return text == null ? null : text.slice(0, HEAD_LEN);
    });
    contents = {};
    scan.forEach((b, i) => { if (texts[i] != null) { contents[b.path] = texts[i]; fresh[b.sha] = texts[i]; } });
    store.set("heads", fresh);
    store.set("lastRepo", { owner: cfg.owner, repo: cfg.repo });
  } catch (e) {
    loadError = e.status === 401 ? "GitHub rejected the token. Paste a new one in Settings."
      : e.status === 404 ? `Couldn't find ${TASKS_PATH} in ${cfg.owner}/${cfg.repo} on branch ${cfg.branch}, or the token has no access to that repository.`
      : e.status === 403 ? "GitHub refused the request (permissions or rate limit). Check the token and try again in a minute."
      : e instanceof TypeError ? "Couldn't reach api.github.com. " + (inFrame
          ? "This page is open inside a preview window that blocks network requests: download the file and open it in your browser."
          : "Check the internet connection or VPN and press Refresh.")
      : "Couldn't reach GitHub: " + e.message;
  } finally {
    loading = false; derive(); render();
  }
}

/* ---------- derived data: commit links, auto-done, macros, review queue ---------- */
function globToRe(glob) {
  return new RegExp("^" + glob.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*\*\/?/g, "§").replace(/\*/g, "[^/]*").replace(/\?/g, "[^/]").replace(/§/g, ".*") + "(/.*)?$");
}
function derive() {
  derived = {};
  if (!doc) return;
  const byId = Object.fromEntries(doc.tasks.map(t => [t.id, t]));
  doc.tasks.forEach(t => derived[t.id] = { commits: [], auto: null });
  [...commits].reverse().forEach(c => {
    c.refs.forEach(r => derived[r] && derived[r].commits.unshift(c));
    c.closes.forEach(r => { if (byId[r] && byId[r].status !== "done" && !derived[r].auto) derived[r].auto = `closed by commit ${c.short}`; });
  });
  doc.tasks.forEach(t => {
    const pat = t.done_when && t.done_when.exists;
    if (pat && t.status !== "done" && !derived[t.id].auto) {
      const re = globToRe(pat), hit = tree.find(p => re.test(p));
      if (hit) derived[t.id].auto = `done: ${hit} exists`;
    }
  });
}
const effStatus = t => derived[t.id]?.auto ? "done" : (STATUS_LABEL[t.status] ? t.status : "todo");
function macros() {
  const by = {};
  tree.forEach(p => { const m = p.match(/^macros\/([^/]+)\/([^/]+)$/); if (m) (by[m[1]] = by[m[1]] || []).push(m[2]); });
  return Object.keys(by).sort().map(name => {
    const files = by[name], dir = `macros/${name}/`;
    const card = files.find(f => f.endsWith(".md") && f !== "README.md"), schema = files.find(f => f.endsWith(".schema.json")), svg = files.find(f => f.endsWith(".svg"));
    let reviewed = !!schema && /"reviewedByHuman"\s*:\s*true/.test(contents[dir + schema] || "");
    if (card && (contents[dir + card] || "").includes(AI_MARK)) reviewed = false;
    const stages = { schema: !!schema, card: !!card, diagram: !!svg, reviewed };
    return { name, dir, stages, progress: Math.round(100 * Object.values(stages).filter(Boolean).length / 4) };
  });
}
const reviewQueue = () => Object.entries(contents)
  .filter(([, head]) => head.includes(AI_MARK) || /"reviewedByHuman"\s*:\s*false/.test(head))
  .map(([p]) => p).sort();
function nextId(data = doc) {
  const n = Math.max(0, ...data.tasks.map(t => parseInt(String(t.id).slice(2), 10) || 0)) + 1;
  return "T-" + String(n).padStart(3, "0");
}

/* ---------- rendering ---------- */
const fmtDate = d => d ? new Date(d.length === 10 ? d + "T00:00:00" : d).toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "—";
const daysLeft = due => Math.round((new Date(due + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5);
const isLate = t => t.due && effStatus(t) !== "done" && t.due < today();

function render() {
  store.set("ui", ui);
  // sandboxed previews (e.g. opaque-origin iframes) refuse URL changes; the tab hash is only a convenience
  try { if (location.hash.slice(1) !== ui.tab) history.replaceState(null, "", "#" + ui.tab); } catch {}
  renderMeta(); renderSavebar();
  if (!cfg.token) return renderConnect();
  if (!doc) {
    $("main").innerHTML = loadError ? `<div class="error">${esc(loadError)}</div><p><button class="btn" type="button" id="retry">Try again</button> <button class="btn ghost" type="button" id="go-settings">Settings</button></p>`
      : `<div class="note">Loading the roadmap from ${esc(cfg.owner)}/${esc(cfg.repo)}…</div>`;
    $("retry") && ($("retry").onclick = load);
    $("go-settings") && ($("go-settings").onclick = () => renderConnect(true));
    return;
  }
  const counts = { checklist: doc.tasks.length, macros: macros().length, review: reviewQueue().length, activity: commits.length };
  $("main").innerHTML = `
    ${loadError ? `<div class="error">${esc(loadError)}</div>` : ""}
    ${treeTruncated ? `<div class="note">The repository is too large for one tree request; Macros and Review queue may be incomplete.</div>` : ""}
    ${renderSummary()}
    <section>
      <div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t.key}" aria-selected="${ui.tab === t.key}">${t.label}<small>${counts[t.key]}</small></button>`).join("")}</div>
      <div id="view">${{ checklist: renderChecklist, macros: renderMacros, review: renderReview, activity: renderActivity }[ui.tab]()}</div>
    </section>`;
  bind();
}

function renderMeta() {
  if (DEFAULTS.preview) {
    const b = $("preview-banner");
    b.hidden = false;
    b.innerHTML = `Preview of branch <b>${esc(DEFAULTS.preview)}</b> · tasks from <b>${esc(cfg.branch)}</b>, edits are real commits · <a href="../../">live page</a>`;
    document.title = "[preview] SAS KB Roadmap";
  }
  $("repo-label").textContent = `${cfg.owner}/${cfg.repo}`;
  $("meta").innerHTML = cfg.token ? `
    <a href="https://github.com/${esc(cfg.owner)}/${esc(cfg.repo)}" target="_blank" rel="noopener">Repository</a>
    <span class="mono">${esc(cfg.branch)}</span>
    <button class="btn" type="button" id="reload" ${loading ? "disabled" : ""}>${loading ? "Loading…" : "Refresh"}</button>
    <button class="btn" type="button" id="settings">Settings</button>` : "";
  $("reload") && ($("reload").onclick = load);
  $("settings") && ($("settings").onclick = () => renderConnect(true));
}

function renderSummary() {
  const n = doc.tasks.length || 1;
  const by = Object.fromEntries(STATUS.map(s => [s.key, doc.tasks.filter(t => effStatus(t) === s.key).length]));
  return `<section class="summary" aria-label="Progress">
    <div class="panel" style="display:grid;gap:10px">
      <div class="label">Overall progress</div>
      <div><span class="big">${Math.round(100 * by.done / n)}%</span> <span class="muted">${by.done} of ${doc.tasks.length} done</span></div>
      <div class="bar">${STATUS.filter(s => by[s.key]).map(s => `<i style="width:${100 * by[s.key] / n}%;background:var(--${s.key})" title="${s.label}: ${by[s.key]}"></i>`).join("")}</div>
    </div>
    <div class="panel" style="display:grid;gap:10px">
      <div class="label">By status · click to filter</div>
      <div class="counts">${STATUS.map(s => `<button class="count" type="button" data-count="${s.key}" aria-pressed="${ui.status === s.key}"><b>${by[s.key]}</b><span><i class="dot" style="background:var(--${s.key})"></i>${s.label}</span></button>`).join("")}</div>
    </div></section>`;
}

function matches(t) {
  const q = ui.q.trim().toLowerCase(), st = effStatus(t);
  return (!ui.area || t.area === ui.area) && (!ui.owner || t.owner === ui.owner) && (!ui.status || st === ui.status) &&
    (!ui.hideDone || st !== "done") && (!q || [t.id, t.title, t.notes, ...(t.links || [])].join(" ").toLowerCase().includes(q));
}
const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`;

function renderChecklist() {
  const filters = `<div class="filters">
    <input type="search" id="f-q" placeholder="Search title, id, notes" aria-label="Search tasks" value="${esc(ui.q)}">
    <select id="f-area" aria-label="Area">${opt("", "All areas", ui.area)}${AREAS.map(a => opt(a, a, ui.area)).join("")}</select>
    <select id="f-owner" aria-label="Owner">${opt("", "Kaa and AI", ui.owner)}${Object.entries(OWNERS).map(([k, l]) => opt(k, l, ui.owner)).join("")}</select>
    <select id="f-status" aria-label="Status">${opt("", "Any status", ui.status)}${STATUS.map(s => opt(s.key, s.label, ui.status)).join("")}</select>
    <label class="toggle"><input type="checkbox" id="f-hide" ${ui.hideDone ? "checked" : ""}> Hide done</label>
    <button class="btn ghost" type="button" id="f-reset">Reset</button>
  </div>`;
  const groups = [...doc.milestones.map(m => ({ m, tasks: doc.tasks.filter(t => t.milestone === m.id) })),
    { m: null, tasks: doc.tasks.filter(t => !t.milestone || !doc.milestones.some(m => m.id === t.milestone)) }];
  const html = groups.filter(g => g.m || g.tasks.length).map(g => renderGroup(g.m, g.tasks)).join("");
  return filters + html + `<button class="btn" type="button" id="add-ms">Add milestone</button>`;
}

function renderGroup(m, tasks) {
  const done = tasks.filter(t => effStatus(t) === "done").length, pct = tasks.length ? Math.round(100 * done / tasks.length) : 0;
  const shown = tasks.filter(matches);
  let due = "";
  if (m && m.due) { const left = daysLeft(m.due); due = pct === 100 || left >= 0 ? `${pct === 100 ? "" : left + " d left · "}due ${fmtDate(m.due)}` : `<span class="late">${-left} d overdue</span>`; }
  const key = m ? m.id : "_none";
  const head = openEditor === "ms:" + key && m ? renderMsEditor(m) : `
    <div><h3>${m ? esc(m.title) : "No milestone"}</h3>${m && m.description ? `<p>${esc(m.description)}</p>` : ""}</div>
    <div class="side"><span class="mono">${done}/${tasks.length} · ${pct}%</span><span>${due}</span>${m ? `<button class="btn ghost" type="button" data-edit-ms="${esc(m.id)}">Edit</button>` : ""}</div>
    <div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div>`;
  return `<section class="group" aria-label="${m ? esc(m.title) : "No milestone"}">
    <div class="group-head">${head}</div>
    ${shown.length ? shown.map(renderRow).join("") : `<div class="empty">${tasks.length ? "No tasks match the filters." : "No tasks yet."}</div>`}
    ${openEditor === "new:" + key ? `<div class="row"><span></span>${renderTaskEditor(null, m ? m.id : "")}</div>` : `<div class="add-row"><button class="btn ghost" type="button" data-add="${esc(key)}">+ Add task</button></div>`}
  </section>`;
}

function renderRow(t) {
  const st = effStatus(t), auto = derived[t.id]?.auto;
  return `<div class="row ${st === "done" ? "is-done" : ""}">
    <input type="checkbox" data-check="${esc(t.id)}" ${st === "done" ? "checked" : ""} ${auto ? "disabled" : ""} aria-label="Mark ${esc(t.id)} done" title="${auto ? esc("Updated automatically: " + auto) : "Mark done"}">
    <div style="min-width:0">
      <button class="title" type="button" data-open="${esc(t.id)}">${esc(t.title)}</button>
      <div class="chips">
        <span class="id">${esc(t.id)}</span>
        <span class="chip owner-${esc(t.owner)}">${OWNERS[t.owner] || esc(t.owner)}</span>
        <span class="chip">${esc(t.area)}</span>
        ${t.priority === "high" ? `<span class="chip pri-high">high</span>` : ""}
        ${t.due && st !== "done" ? `<span class="${isLate(t) ? "late" : "muted"}">due ${fmtDate(t.due)}</span>` : ""}
        ${st === "done" && t.done ? `<span class="muted">done ${fmtDate(t.done)}</span>` : ""}
        ${auto ? `<span class="chip auto">auto</span>` : ""}
      </div>
    </div>
    <div class="right"><select class="status-sel" data-status="${esc(t.id)}" aria-label="Status of ${esc(t.id)}" style="color:var(--${st})" ${auto ? "disabled" : ""}>${STATUS.map(s => opt(s.key, s.label, st)).join("")}</select></div>
    ${openEditor === "task:" + t.id ? renderTaskEditor(t) : ""}
  </div>`;
}

function renderTaskEditor(t, msId) {
  const v = t || { id: nextId(), title: "", milestone: msId, area: "macros", status: "todo", owner: "kaa", priority: "normal", due: "", notes: "", links: [] };
  const d = t ? derived[t.id] : null;
  return `<form class="editor" data-form="${t ? esc(t.id) : "new"}">
    <label class="field"><span>Title</span><input type="text" name="title" value="${esc(v.title)}" required placeholder="What needs to happen"></label>
    <div class="grid2">
      <label class="field"><span>Status</span><select name="status">${STATUS.map(s => opt(s.key, s.label, v.status)).join("")}</select></label>
      <label class="field"><span>Owner</span><select name="owner">${Object.entries(OWNERS).map(([k, l]) => opt(k, l, v.owner)).join("")}</select></label>
      <label class="field"><span>Area</span><select name="area">${AREAS.map(a => opt(a, a, v.area)).join("")}</select></label>
      <label class="field"><span>Priority</span><select name="priority">${PRIORITIES.map(p => opt(p, p, v.priority || "normal")).join("")}</select></label>
      <label class="field"><span>Milestone</span><select name="milestone">${opt("", "None", v.milestone || "")}${doc.milestones.map(m => opt(m.id, m.title, v.milestone || "")).join("")}</select></label>
      <label class="field"><span>Due</span><input type="date" name="due" value="${esc(v.due || "")}"></label>
    </div>
    <label class="field"><span>Notes</span><textarea name="notes" rows="2">${esc(v.notes || "")}</textarea></label>
    <label class="field"><span>Links (repo paths or URLs, comma-separated)</span><input type="text" name="links" value="${esc((v.links || []).join(", "))}"></label>
    ${t && (t.links || []).length ? `<div class="history">${t.links.map(l => `<a href="${esc(ghUrl(l))}" target="_blank" rel="noopener">${esc(l)}</a>`).join(" · ")}</div>` : ""}
    ${d && d.auto ? `<div class="chips"><span class="chip auto">Updated automatically: ${esc(d.auto)}</span></div>` : ""}
    ${d ? `<div class="history"><span class="label">Commits mentioning ${esc(t.id)}</span>${d.commits.length ? `<ul>${d.commits.slice(0, 8).map(c => `<li><a class="mono" href="https://github.com/${esc(cfg.owner)}/${esc(cfg.repo)}/commit/${esc(c.sha)}" target="_blank" rel="noopener">${esc(c.short)}</a> ${esc(c.subject)}</li>`).join("")}</ul>` : `<div class="muted">None yet. Write <span class="mono">${esc(t.id)}</span> in a commit message to link it, or <span class="mono">closes ${esc(t.id)}</span> to finish it.</div>`}</div>` : ""}
    <div class="actions">
      <div style="display:flex;gap:8px"><button class="btn primary" type="submit">${t ? "Save" : "Add task"}</button><button class="btn" type="button" data-cancel>Cancel</button></div>
      ${t ? `<button class="btn danger" type="button" data-delete="${esc(t.id)}" data-armed="0">Delete task</button>` : `<span class="id">${esc(v.id)}</span>`}
    </div>
  </form>`;
}

function renderMsEditor(m) {
  return `<form class="editor" data-ms-form="${esc(m.id)}" style="grid-column:1/-1;margin:0">
    <div class="grid2">
      <label class="field"><span>Title</span><input type="text" name="title" value="${esc(m.title)}" required></label>
      <label class="field"><span>Due</span><input type="date" name="due" value="${esc(m.due || "")}"></label>
    </div>
    <label class="field"><span>Description</span><textarea name="description" rows="2">${esc(m.description || "")}</textarea></label>
    <div class="actions"><div style="display:flex;gap:8px"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-cancel>Cancel</button></div><span class="id">${esc(m.id)}</span></div>
  </form>`;
}

function renderMacros() {
  const list = macros();
  if (!list.length) return `<div class="note" style="margin-top:14px">No macros documented yet. Each folder in <code>macros/&lt;name&gt;/</code> appears here with its pipeline: schema → card → diagram → reviewed by a human. Stages are read from the files in the repo.</div>`;
  const st = (on, l) => `<span class="stage ${on ? "on" : "off"}" title="${l}: ${on ? "done" : "missing"}">${on ? "✓" : "·"}</span>`;
  return `<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Macro</th><th>Schema</th><th>Card</th><th>Diagram</th><th>Reviewed</th><th>Progress</th></tr></thead><tbody>
    ${list.map(m => `<tr><td class="mono"><a href="${esc(ghUrl(m.dir))}" target="_blank" rel="noopener">%${esc(m.name)}</a></td>
      <td>${st(m.stages.schema, "Schema")}</td><td>${st(m.stages.card, "Card")}</td><td>${st(m.stages.diagram, "Diagram")}</td><td>${st(m.stages.reviewed, "Reviewed")}</td>
      <td style="min-width:140px"><div class="bar"><i style="width:${m.progress}%;background:var(--accent)"></i></div><span class="mono muted" style="font-size:12px">${m.progress}%</span></td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderReview() {
  const q = reviewQueue();
  if (!q.length) return `<div class="note" style="margin-top:14px">Every AI-generated file has been reviewed.</div>`;
  return `<div class="note" style="margin:14px 0 12px">AI-generated files still marked <code>${AI_MARK}</code>. After reviewing a file, change its mark to “reviewed by a human, YYYY-MM-DD”; it leaves this list on the next refresh.</div>
    <div class="table-wrap"><table><thead><tr><th>File</th><th>Folder</th></tr></thead><tbody>
    ${q.map(p => `<tr><td class="mono" style="font-size:13px"><a href="${esc(ghUrl(p))}" target="_blank" rel="noopener">${esc(p)}</a></td><td class="muted">${esc(p.includes("/") ? p.split("/")[0] : "root")}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderActivity() {
  if (!commits.length) return `<div class="note" style="margin-top:14px">No commits found.</div>`;
  return `<div class="feed" style="margin-top:14px">${commits.slice(0, 50).map(c => `<div>
    <a class="mono" href="https://github.com/${esc(cfg.owner)}/${esc(cfg.repo)}/commit/${esc(c.sha)}" target="_blank" rel="noopener">${esc(c.short)}</a>
    <span class="subj">${esc(c.subject)} ${c.refs.map(r => `<button class="chip" type="button" data-jump="${esc(r)}" style="border:0;cursor:pointer">${esc(r)}</button>`).join(" ")}</span>
    <span class="muted mono" style="font-size:12px">${fmtDate(c.date)}</span></div>`).join("")}</div>`;
}

function renderSavebar() {
  const bar = $("savebar");
  let html = "";
  if (saving) html = `<span>Saving to GitHub…</span>`;
  else if (saveError) html = `<span>${esc(saveError)}</span><button class="btn" type="button" id="sb-retry">Retry</button>`;
  else if (pending.length) html = `<span>${pending.length} change${pending.length > 1 ? "s" : ""} · saving in a moment</span><button class="btn" type="button" id="sb-now">Save now</button>`;
  else if (lastSave && Date.now() - lastSave.at < 8000) html = `<span>Saved · commit <a class="mono" href="https://github.com/${esc(cfg.owner)}/${esc(cfg.repo)}/commit/${esc(lastSave.sha)}" target="_blank" rel="noopener">${esc(lastSave.short)}</a></span>`;
  bar.hidden = !html; bar.innerHTML = html;
  $("sb-retry") && ($("sb-retry").onclick = () => { saveError = null; save(); });
  $("sb-now") && ($("sb-now").onclick = () => { clearTimeout(saveTimer); save(); });
  clearTimeout(savebarTimer);
  if (html && lastSave && !saving && !saveError && !pending.length) savebarTimer = setTimeout(renderSavebar, 8200);
}

function renderConnect(fromSettings) {
  renderMeta();
  $("main").innerHTML = `<section class="panel connect">
    <h2>${fromSettings ? "Settings" : "Connect to GitHub"}</h2>
    ${inFrame ? `<div class="error">This page is running inside a preview window. Previews block requests to GitHub, so connecting won't work here. Download the file and open it in Chrome, Firefox or Yandex Browser.</div>` : ""}
    <p class="muted" style="margin:0">The roadmap lives in <code>${TASKS_PATH}</code> in your repository. This page reads it directly from GitHub and saves your edits back as commits, so the token never leaves this browser.</p>
    <ol>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained tokens → Generate new token</a>.</li>
      <li>Repository access: <b>Only select repositories</b> → <code>${esc(cfg.repo)}</code>.</li>
      <li>Permissions: <b>Contents — Read and write</b>. Nothing else is needed.</li>
      <li>Paste the token below.</li>
    </ol>
    <form id="connect-form" class="editor" style="margin:0">
      <div class="grid2">
        <label class="field"><span>Owner</span><input type="text" id="c-owner" value="${esc(cfg.owner)}" required></label>
        <label class="field"><span>Repository</span><input type="text" id="c-repo" value="${esc(cfg.repo)}" required></label>
        <label class="field"><span>Branch</span><input type="text" id="c-branch" value="${esc(cfg.branch)}" required></label>
      </div>
      <label class="field"><span>Token</span><input type="password" id="c-token" value="${esc(cfg.token || "")}" placeholder="github_pat_…" autocomplete="off" required></label>
      <label class="toggle"><input type="checkbox" id="c-remember" ${store.get("token", null) || !cfg.token ? "checked" : ""}> Remember on this device</label>
      <div class="actions"><div style="display:flex;gap:8px"><button class="btn primary" type="submit">Connect</button>${fromSettings ? `<button class="btn" type="button" id="c-cancel">Cancel</button>` : ""}</div>
        ${cfg.token ? `<button class="btn danger" type="button" id="c-forget">Forget token</button>` : ""}</div>
    </form></section>`;
  onForm($("connect-form"), () => {
    Object.assign(cfg, { owner: $("c-owner").value.trim(), repo: $("c-repo").value.trim(), branch: $("c-branch").value.trim(), token: $("c-token").value.trim() });
    store.set(CFG_KEY, { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch });
    if ($("c-remember").checked) store.set("token", cfg.token); else { store.set("token", null); try { sessionStorage.setItem("roadmap:token", cfg.token); } catch {} }
    doc = null; load();
  });
  $("c-cancel") && ($("c-cancel").onclick = render);
  $("c-forget") && ($("c-forget").onclick = () => { store.set("token", null); try { sessionStorage.removeItem("roadmap:token"); } catch {} cfg.token = null; doc = null; render(); });
}

/* ---------- events ---------- */
// Sandboxed frames without "allow-forms" never fire submit, so every form is also driven by its button's click.
function onForm(form, handler) {
  const run = e => { e.preventDefault(); if (form.reportValidity()) handler(form); };
  form.addEventListener("submit", run);
  form.querySelectorAll('[type="submit"]').forEach(b => b.addEventListener("click", run));
}
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
function bind() {
  const root = $("main");
  root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; openEditor = null; render(); });
  root.querySelectorAll("[data-count]").forEach(b => b.onclick = () => { ui.status = ui.status === b.dataset.count ? "" : b.dataset.count; ui.tab = "checklist"; render(); });
  if (ui.tab === "checklist") {
    $("f-q").oninput = e => { ui.q = e.target.value; const pos = e.target.selectionStart; render(); $("f-q").focus(); $("f-q").setSelectionRange(pos, pos); };
    ["area", "owner", "status"].forEach(k => $("f-" + k).onchange = e => { ui[k] = e.target.value; render(); });
    $("f-hide").onchange = e => { ui.hideDone = e.target.checked; render(); };
    $("f-reset").onclick = () => { Object.assign(ui, { q: "", area: "", owner: "", status: "", hideDone: false }); render(); };
    $("add-ms").onclick = () => {
      const n = Math.max(0, ...doc.milestones.map(m => parseInt(String(m.id).slice(1), 10) || 0)) + 1;
      const ms = { id: "m" + n, title: "New milestone" };
      edit({ type: "add-ms", ms }); openEditor = "ms:" + ms.id; render();
    };
  }
  root.querySelectorAll("[data-check]").forEach(cb => cb.onchange = () => {
    const done = cb.checked;
    edit({ type: "task", id: cb.dataset.check, fields: { status: done ? "done" : "todo", done: done ? today() : "" } });
  });
  root.querySelectorAll("[data-status]").forEach(sel => sel.onchange = () => {
    const s = sel.value;
    edit({ type: "task", id: sel.dataset.status, fields: { status: s, done: s === "done" ? today() : "" } });
  });
  root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { openEditor = openEditor === "task:" + b.dataset.open ? null : "task:" + b.dataset.open; render(); });
  root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { openEditor = "new:" + b.dataset.add; render(); root.querySelector('[data-form="new"] input[name="title"]')?.focus(); });
  root.querySelectorAll("[data-edit-ms]").forEach(b => b.onclick = () => { openEditor = "ms:" + b.dataset.editMs; render(); });
  root.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { openEditor = null; render(); });
  root.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { ui.tab = "checklist"; Object.assign(ui, { q: "", status: "", area: "", owner: "", hideDone: false }); openEditor = "task:" + b.dataset.jump; render(); });
  root.querySelectorAll("[data-delete]").forEach(b => b.onclick = () => {
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Click again to delete"; return; }
    edit({ type: "delete-task", id: b.dataset.delete }); openEditor = null; render();
  });
  root.querySelectorAll("[data-form]").forEach(f => onForm(f, () => {
    const fd = new FormData(f), id = f.dataset.form;
    const fields = {
      title: fd.get("title").trim(), status: fd.get("status"), owner: fd.get("owner"), area: fd.get("area"),
      priority: fd.get("priority") === "normal" ? "" : fd.get("priority"), milestone: fd.get("milestone"), due: fd.get("due"),
      notes: fd.get("notes").trim(), links: fd.get("links").split(",").map(s => s.trim()).filter(Boolean)
    };
    if (!fields.title) return;
    if (id === "new") {
      edit({ type: "add-task", task: clean({ id: nextId(), ...fields, created: today(), done: fields.status === "done" ? today() : "" }) });
    } else {
      const t = doc.tasks.find(x => x.id === id);
      if (fields.status === "done" && t.status !== "done") fields.done = today();
      if (fields.status !== "done") fields.done = "";
      edit({ type: "task", id, fields });
    }
    openEditor = null; render();
  }));
  root.querySelectorAll("[data-ms-form]").forEach(f => onForm(f, () => {
    const fd = new FormData(f);
    edit({ type: "ms", id: f.dataset.msForm, fields: { title: fd.get("title").trim(), due: fd.get("due"), description: fd.get("description").trim() } });
    openEditor = null; render();
  }));
}

function showCrash(msg) {
  const box = document.createElement("div");
  box.className = "error"; box.style.marginTop = "12px";
  box.textContent = "Something went wrong: " + msg + ". Reload the page; if it repeats, send this message to Claude.";
  $("main").prepend(box);
}
window.addEventListener("error", e => showCrash(e.message || "script error"));
window.addEventListener("unhandledrejection", e => showCrash(e.reason && e.reason.message || String(e.reason)));

if (typeof jsyaml === "undefined") {
  $("main").innerHTML = `<div class="error">The YAML library (js-yaml.min.js) didn't load. It has to sit in the same folder as this page; rebuild with roadmap/build.py.</div>`;
} else {
  render();
  load();
}
</script>
</body>
</html>
